<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Netvy Studios</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2367462f'/%3E%3Crect width='16' height='5' fill='%23568634'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display&family=Silkscreen&display=swap">
<style id="page-css">
  /* Layout: a black gallery wall — monumental type, one floating block, quiet 12px labels. */
  :root {
    /* Colors — achromatic on purpose; this page has a single dark look */
    --color-onyx: #0e0e0e;
    --color-paper-white: #fefefe;
    --color-faint-white: #2a2a2a;
    --color-scrim: rgba(14, 14, 14, .86);
    --color-splash: #ffef4a;          /* game-style yellow splash text */
    --color-splash-shadow: #3f3a0e;

    /* Families: ak (sans workhorse) / gs (editorial serif, project titles only) */
    --font-ak: 'ak', 'Neue Haas Grotesk Display Pro', 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-gs: 'gs', 'GT Sectra', 'Playfair Display', ui-serif, Georgia, 'Times New Roman', serif;
    --font-pixel: 'Silkscreen', ui-monospace, 'Courier New', monospace;

    /* Type scale — whispers and shouts, no middle ground */
    --text-caption: 12px;     --leading-caption: 1.5;
    --text-body-sm: 14px;     --leading-body-sm: 1.4;
    --text-body: 18px;        --leading-body: 1.33;
    --text-subheading: 20px;  --leading-subheading: 1.1;
    --text-heading: 58px;     --leading-heading: 1;
    --text-heading-lg: clamp(40px, 5vw, 72px);  --leading-heading-lg: 0.9;
    --leading-display: 0.8;
    /* Hero words: "STUDIOS" (4.11em) always fits the width; never taller than ~20% of the screen */
    --display-hero: clamp(44px, min(calc((100vw - 40px) / 4.35), 17vh), 216px);
    --display-contact: clamp(36px, calc((100vw - 40px) / 8.4), 216px);   /* refined in JS per language */
    /* The block: square, between the words, shrinks on short or narrow screens */
    --stage: clamp(180px, min(88vw, 45vh), 620px);

    --font-weight-regular: 400;
    --font-weight-bold: 700;

    /* Spacing — 8px base */
    --spacing-8: 8px;
    --spacing-16: 16px;
    --spacing-32: 32px;
    --gutter: var(--spacing-16);
    --section-gap: clamp(96px, 9vw, 128px);

    /* Shape — sharp everywhere */
    --radius-buttons: 0px;

    --ease-out: cubic-bezier(.16, 1, .3, 1);
  }
  @supports (height: 1svh) {
    :root {
      --display-hero: clamp(44px, min(calc((100vw - 40px) / 4.35), 17svh), 216px);
      --stage: clamp(180px, min(88vw, 45svh), 620px);
    }
  }

  /* ───────────────────────── Base ───────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html {
    background: var(--color-onyx);
    color-scheme: dark;
    overflow-x: hidden;   /* older iOS */
    overflow-x: clip;
    -webkit-text-size-adjust: 100%;
  }
  body {
    background: var(--color-onyx);
    color: var(--color-paper-white);
    font-family: var(--font-ak);
    font-weight: var(--font-weight-regular);
    font-size: var(--text-caption);
    line-height: var(--leading-caption);
    font-feature-settings: 'cv11', 'ss01';
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    overflow-x: clip;
    min-height: 100vh;
  }
  #app {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  a { color: inherit; text-decoration: none; }
  button {
    font: inherit; color: inherit; background: none; border: 0;
    border-radius: var(--radius-buttons); text-align: inherit; cursor: pointer;
  }
  ::selection { background: var(--color-faint-white); color: var(--color-paper-white); }
  :focus-visible { outline: 1px solid var(--color-paper-white); outline-offset: 4px; }

  /* 3D stage — lives only in the hero; drag it with a finger or the mouse */
  .stage {
    position: relative;
    width: var(--stage);
    height: var(--stage);
    max-width: 100%;
    margin-block: calc(var(--stage) * -0.07) calc(var(--stage) * -0.04);   /* close to the words, never over them */
    z-index: 3;
    display: block;
    touch-action: none;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .stage.is-grabbing { cursor: grabbing; }
  .stage:focus-visible { outline: 1px solid var(--color-paper-white); outline-offset: -1px; }

  /* ───────────────────────── Buttons & fields ───────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-8);
    padding: 12px 18px;
    background: var(--color-paper-white);
    color: var(--color-onyx);
    font-size: var(--text-caption);
    font-weight: var(--font-weight-bold);
    letter-spacing: .04em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .btn:hover { opacity: .85; }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn--ghost {
    background: none;
    color: var(--color-paper-white);
    padding: 12px 0;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .btn--small { padding: 6px 0; font-weight: var(--font-weight-regular); }

  .field { display: flex; flex-direction: column; gap: var(--spacing-8); min-width: 0; }
  .field-row > .field { flex: 1 1 160px; }
  .admin__login > .field { flex: 1 1 220px; }
  .field__label { font-size: var(--text-caption); line-height: var(--leading-caption); }
  .field input, .field select {
    width: 100%;
    min-width: 0;
    padding: 10px 12px;
    border: 0;
    border-radius: 0;
    background: var(--color-faint-white);
    color: var(--color-paper-white);
    font: inherit;
    font-size: var(--text-body-sm);
    line-height: var(--leading-body-sm);
  }
  .field input::placeholder { color: var(--color-paper-white); opacity: .4; }
  .field-row { display: flex; flex-wrap: wrap; gap: var(--gutter); }

  /* ───────────────────────── Top navigation ───────────────────────── */
  .nav {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-block: var(--spacing-16);
    font-size: var(--text-caption);
    line-height: var(--leading-caption);
  }
  .nav__cta { font-weight: var(--font-weight-bold); }
  .nav a:hover, .nav button:hover, .locale button:hover, .contact__foot a:hover { opacity: .6; }

  /* Locale switcher — no active state, availability only */
  .locale {
    position: absolute;
    top: calc(var(--spacing-16) + 18px + var(--spacing-8));
    right: 0;
    z-index: 5;
    display: flex;
    gap: .35em;
    white-space: pre;
  }

  /* ───────────────────────── Display headline ───────────────────────── */
  .display {
    display: block;
    font-family: var(--font-ak);
    font-weight: var(--font-weight-regular);
    line-height: var(--leading-display);
    letter-spacing: -0.045em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .line-inner { display: inline-block; }

  /* ───────────────────────── Hero ───────────────────────── */
  .hero {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    grid-template-rows: 1fr auto;
    gap: var(--spacing-32);
    padding-top: 80px;                 /* clears the nav and the language switch */
  }
  .hero__bg {                          /* floating game items, kept clear of every text */
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    display: block;
  }
  .hero__foot { position: relative; z-index: 1; }
  .hero__stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 0;
  }
  .hero__word {
    position: relative;
    z-index: 1;
    font-size: var(--display-hero);
    text-align: center;
  }
  .hero__word .ch { display: inline-block; }

  .hero__foot {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    column-gap: var(--gutter);
    align-items: end;
    padding-bottom: var(--spacing-16);
  }
  .label { font-size: var(--text-caption); line-height: var(--leading-caption); font-weight: var(--font-weight-regular); }
  .hero__region { grid-column: 1 / 4; }
  .hero__hint { grid-column: 5 / 8; }
  .hero__about {
    grid-column: 9 / 13;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--spacing-16);
  }
  .caption {
    max-width: 320px;
    font-size: var(--text-caption);
    line-height: 1.56;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  /* ───────────────────────── Projects ───────────────────────── */
  .archive {
    position: relative;
    z-index: 1;
    padding-top: var(--section-gap);
  }
  .archive__head {
    display: flex;
    justify-content: space-between;
    margin-bottom: var(--spacing-32);
  }
  .archive__list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: var(--spacing-32);
  }
  .archive__empty { font-size: var(--text-body); line-height: var(--leading-body); }
  .entry__row {
    width: 100%;
    display: grid;
    grid-template-columns: minmax(0, 6fr) minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1.5fr) minmax(0, 1.5fr);
    column-gap: var(--gutter);
    align-items: baseline;
    transition: opacity .5s var(--ease-out);
  }
  .entry__title {
    font-family: var(--font-gs);
    font-weight: var(--font-weight-regular);
    font-size: var(--text-heading-lg);
    line-height: var(--leading-heading-lg);
    letter-spacing: -0.01em;
    font-feature-settings: normal;
    overflow-wrap: anywhere;
  }
  .entry__num {
    font-family: var(--font-gs);
    font-size: var(--text-caption);
    line-height: 1.33;
    letter-spacing: 0;
    vertical-align: top;
    margin-left: .5em;
  }
  .entry__meta { font-size: var(--text-caption); line-height: 1.33; overflow-wrap: anywhere; }
  .entry__meta a { text-decoration: underline; text-underline-offset: 3px; }
  @media (hover: hover) {
    .archive__list:has(.entry:hover) .entry:not(:hover) .entry__row { opacity: .22; }
  }

  /* ───────────────────────── Contact ───────────────────────── */
  .contact {
    position: relative;
    z-index: 1;
    padding-top: var(--section-gap);
  }
  .contact__display {
    display: flex;
    justify-content: center;
    width: 100%;
    padding-top: 1.2em;               /* room for the splash above the word */
    font-size: var(--display-contact);
    text-align: center;
  }
  .contact__display:hover .contact__word { opacity: .85; }
  .contact__wordwrap { position: relative; display: inline-block; }
  .splash {
    position: absolute;
    right: 6%;
    bottom: 100%;
    margin-bottom: .1em;
    font-family: var(--font-pixel);
    font-size: max(15px, .2em);
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0;
    text-transform: none;
    color: var(--color-splash);
    text-shadow: .12em .12em 0 var(--color-splash-shadow);
    transform: rotate(-12deg);
    transform-origin: 0 100%;
    white-space: nowrap;
    pointer-events: none;
  }
  .contact__foot {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: var(--spacing-8) var(--gutter);
    padding-block: var(--spacing-32) var(--spacing-16);
  }
  .foot__secret { cursor: default; -webkit-tap-highlight-color: transparent; }

  /* ───────────────────────── Contact dialog ───────────────────────── */
  .dialog {
    margin: auto;
    width: min(520px, calc(100% - 32px));
    max-height: calc(100% - 32px);
    padding: var(--spacing-32);
    border: 0;
    border-radius: 0;
    outline: 1px solid var(--color-faint-white);
    background: var(--color-onyx);
    color: var(--color-paper-white);
  }
  .dialog::backdrop { background: var(--color-scrim); }
  .dialog__head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: var(--gutter);
    margin-bottom: var(--spacing-32);
  }
  .dialog__title {
    font-size: var(--text-heading);
    line-height: var(--leading-heading);
    font-weight: var(--font-weight-regular);
    letter-spacing: -0.03em;
  }
  .dialog__list { list-style: none; display: flex; flex-direction: column; gap: var(--spacing-16); }
  .dialog__empty { font-size: var(--text-body-sm); line-height: var(--leading-body-sm); }
  .contact-item { display: flex; flex-direction: column; gap: 4px; }
  .contact-item__value {
    font-size: var(--text-body);
    line-height: var(--leading-body);
    user-select: all;
    -webkit-user-select: all;
    overflow-wrap: anywhere;
  }
  .contact-item__actions { display: flex; gap: var(--gutter); }

  /* ───────────────────────── Admin ───────────────────────── */
  .admin {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: var(--spacing-32);
    padding-block: var(--section-gap) var(--spacing-32);
  }
  .admin__login { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--gutter); max-width: 520px; }
  .admin__msg { flex-basis: 100%; font-size: var(--text-caption); line-height: var(--leading-caption); min-height: 18px; }
  .admin__panel { display: flex; flex-direction: column; gap: var(--spacing-32); }
  .admin__bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: var(--gutter); }
  .admin__mode { max-width: 640px; font-size: var(--text-body-sm); line-height: var(--leading-body-sm); }
  .admin__cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--spacing-32); }
  .admin__block { display: flex; flex-direction: column; gap: var(--spacing-16); min-width: 0; }
  .admin__h { font-size: var(--text-subheading); line-height: var(--leading-subheading); font-weight: var(--font-weight-regular); }
  .admin__sub { font-size: var(--text-caption); line-height: var(--leading-caption); font-weight: var(--font-weight-bold); text-transform: uppercase; letter-spacing: .04em; }
  .admin__note { font-size: var(--text-caption); line-height: var(--leading-caption); opacity: .7; }
  .admin__items { list-style: none; display: flex; flex-direction: column; gap: var(--spacing-8); }
  .admin__item { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--spacing-8) var(--gutter); }
  .admin__info { display: flex; flex-direction: column; min-width: 0; }
  .admin__name { font-size: var(--text-body-sm); line-height: var(--leading-body-sm); overflow-wrap: anywhere; }
  .admin__meta { font-size: var(--text-caption); line-height: var(--leading-caption); opacity: .7; overflow-wrap: anywhere; }
  .admin__btns { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gutter); }
  .admin__form { display: flex; flex-direction: column; gap: var(--spacing-16); padding-top: var(--spacing-16); }
  .admin__actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gutter); }
  .admin__publish { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gutter); }
  .admin__publish .admin__msg { flex-basis: auto; flex: 1 1 240px; font-size: var(--text-body-sm); line-height: var(--leading-body-sm); }

  /* ───────────────────────── Motion ───────────────────────── */
  @media (prefers-reduced-motion: no-preference) {
    .hero__word .ch {
      animation: drop .85s cubic-bezier(.25, 1.45, .5, 1) both;
      animation-delay: calc(var(--i, 0) * 65ms + 150ms);
    }
    .splash { animation: splash 1s ease-in-out infinite; }
    .fade { animation: fade 1.2s .7s var(--ease-out) both; }
  }
  @keyframes drop {
    from { transform: translate3d(0, -.75em, 0) rotate(-6deg); opacity: 0; }
    40%  { opacity: 1; }
    to   { transform: none; opacity: 1; }
  }
  @keyframes splash {
    0%, 100% { transform: rotate(-12deg) scale(1); }
    50%      { transform: rotate(-12deg) scale(1.08); }
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* ───────────────────────── Small screens ───────────────────────── */
  @media (max-width: 760px) {
    .hero__foot { grid-template-columns: 1fr 1fr; row-gap: var(--spacing-16); }
    .hero__hint { grid-column: 1 / -1; order: -1; }
    .hero__region { grid-column: 1; }
    .hero__about { grid-column: 2; }

    .entry__row {
      grid-template-columns: repeat(4, auto);
      justify-content: space-between;
      row-gap: var(--spacing-8);
    }
    .entry__title { grid-column: 1 / -1; }


    .admin__cols { grid-template-columns: 1fr; }
  }
  /* Phones on their side and other short screens */
  @media (max-height: 520px) and (orientation: landscape) {
    :root {
      --display-hero: clamp(36px, 15vh, 120px);
      --stage: clamp(150px, 46vh, 400px);
    }
    @supports (height: 1svh) {
      :root {
        --display-hero: clamp(36px, 15svh, 120px);
        --stage: clamp(150px, 46svh, 400px);
      }
    }
    .hero { padding-top: 68px; gap: var(--spacing-16); }
    .hero__hint { display: none; }
  }
</style>
<template id="page-markup">
<main id="top">

  <section class="hero">
    <canvas id="floaters" class="hero__bg" aria-hidden="true"></canvas>
    <header class="nav fade">
      <a class="nav__brand" href="#top">netvy studios</a>
      <button type="button" class="nav__cta" data-contact data-i18n="cta">CONTÁCTANOS</button>
    </header>
    <nav class="locale fade" aria-label="Idioma"></nav>
    <h1 class="sr-only">Netvy Studios</h1>
    <div class="hero__stack">
      <p class="display hero__word" aria-hidden="true"><span class="line-inner">Netvy</span></p>
      <canvas id="stage" class="stage" tabindex="0" role="img" aria-label="Bloque de pasto. Arrástralo para girarlo." data-i18n-aria="block"></canvas>
      <p class="display hero__word" aria-hidden="true"><span class="line-inner">Studios</span></p>
    </div>
    <div class="hero__foot fade">
      <p class="label hero__region">US / WW</p>
      <p class="label hero__hint" data-i18n="drag">(Arrastra para girar)</p>
      <div class="hero__about">
        <p class="caption" data-i18n="caption">Somos un estudio que hace réplicas de proyectos muy famosos, como DEDsafio y Extremo.</p>
        <button type="button" class="btn" data-contact data-i18n="contactBtn">Contáctanos</button>
      </div>
    </div>
  </section>

  <section class="archive" id="proyectos" aria-labelledby="projects-label">
    <div class="archive__head">
      <h2 class="label" id="projects-label" data-i18n="projects">Proyectos</h2>
      <p class="label" id="projects-count">(00)</p>
    </div>
    <ol class="archive__list" id="projects-list"></ol>
    <p class="archive__empty" id="projects-empty" data-i18n="noProjects" hidden>Todavía no hay proyectos.</p>
  </section>

  <section class="contact" id="contacto" aria-label="Contacto">
    <button type="button" class="display contact__display" data-contact>
      <span class="contact__wordwrap">
        <span class="contact__word" id="contact-word" data-i18n="c1">Construyamos</span>
        <span class="splash" data-i18n="splash" aria-hidden="true">¡Juntos!</span>
      </span>
    </button>
    <div class="contact__foot">
      <button type="button" class="foot__secret" id="admin-open">© 2026 netvy studios</button>
      <a href="#top" data-i18n="top">Volver arriba</a>
    </div>
  </section>

  <section class="admin" id="admin" aria-labelledby="admin-title" hidden>
    <h2 class="label" id="admin-title">Admin</h2>

    <div class="admin__panel" id="admin-panel">
      <div class="admin__bar">
        <p class="admin__mode" id="admin-mode"></p>
        <button type="button" class="btn btn--ghost" id="admin-logout">Salir</button>
      </div>

      <div class="admin__cols">
        <div class="admin__block">
          <h3 class="admin__h">Proyectos</h3>
          <ol class="admin__items" id="admin-projects"></ol>
          <form class="admin__form" id="project-form">
            <h4 class="admin__sub" id="pf-title">Añadir proyecto</h4>
            <label class="field" for="pf-name">
              <span class="field__label">Nombre</span>
              <input id="pf-name" name="pf-name" maxlength="60" required placeholder="DEDsafio">
            </label>
            <div class="field-row">
              <label class="field" for="pf-year">
                <span class="field__label">Año</span>
                <input id="pf-year" name="pf-year" inputmode="numeric" maxlength="4" placeholder="2026">
              </label>
              <label class="field" for="pf-type">
                <span class="field__label">Tipo</span>
                <input id="pf-type" name="pf-type" maxlength="40" placeholder="Réplica">
              </label>
            </div>
            <div class="field-row">
              <label class="field" for="pf-status">
                <span class="field__label">Estado</span>
                <select id="pf-status" name="pf-status">
                  <option value="soon">Próximamente</option>
                  <option value="progress">En proceso</option>
                  <option value="done">Terminado</option>
                  <option value="paused">Pausado</option>
                </select>

    }
    saveBtn.disabled = !dirty;
    if (!statusEl.textContent || /cambios sin|Todo está/.test(statusEl.textContent)) {
      setStatus(dirty ? (IN_VIEWER ? 'Tienes cambios sin publicar.' : 'Tienes cambios sin guardar.') : 'Todo está al día.');

  }
  function changed() {
    dirty = true;

    setStatus(IN_VIEWER ? 'Tienes cambios sin publicar.' : 'Tienes cambios sin guardar.');

  }

  function smallBtn(text, onClick, opts = {}) {

  function renderAdmin() {

      ol.replaceChildren(...draft.projects.map((p, i) => {
        const li = el('li', 'admin__item');
        const info = el('div', 'admin__info');
        info.append(el('span', 'admin__name', p.name), el('span', 'admin__meta', [p.year, statusText(p, 'es'), p.type].filter(Boolean).join(' · ')));
        const btns = el('div', 'admin__btns');

          btns.append(el('span', 'admin__meta', '¿Borrar «' + p.name + '»?'),
            smallBtn('Sí, borrar', () => { draft.projects = draft.projects.filter(x => x.id !== p.id); if (editingId === p.id) resetProjectForm(); changed(); }),
            smallBtn('No', () => { confirmId = null; renderAdmin(); }));
        } else {
          btns.append(
            smallBtn('Editar', () => startEdit(p)),
            smallBtn('↑', () => moveProject(i, -1), { label: 'Subir ' + p.name, disabled: i === 0 }),
            smallBtn('↓', () => moveProject(i, 1), { label: 'Bajar ' + p.name, disabled: i === draft.projects.length - 1 }),

      cl.replaceChildren(...draft.contacts.map(c => {

        const info = el('div', 'admin__info');

  function moveProject(i, dir) {

    draft.projects = list;
    changed();
  }

  const pf = {
    form: $('#project-form'), title: $('#pf-title'), name: $('#pf-name'), year: $('#pf-year'), type: $('#pf-type'),

  saveBtn.addEventListener('click', async () => {
    if (!dirty) return;
    const data = normalize(draft);
    if (!IN_VIEWER) {
      if (store.set('localStorage', LOCAL_KEY, JSON.stringify(data))) {
        published = clone(data);
        dirty = false;
        setStatus('Guardado en este navegador. Para que lo vea todo el mundo, descarga el index.html y súbelo a GitHub.');
      } else {
        setStatus('Este navegador no deja guardar. Descarga el index.html para no perder los cambios.');

    } catch (err) {

        setStatus('Se publicó otra versión a la vez. La página se recarga con ella; tus cambios se recuperan al volver a entrar.');

        return;

      saveBtn.disabled = false;

  /* ════════════════════════════════════════════════════════════════════

     ════════════════════════════════════════════════════════════════════ */
  function pixelKit(T) {
    const DIRT = [[0.13, '#452c1a'], [0.21, '#4f3822'], [0.33, '#5f432e'], [0.55, '#67462f'], [0.64, '#6e5038'], [0.87, '#7c5b41'], [1, '#937052']];

    const GRASS_SIDE = [[0.15, '#4c742b'], [0.47, '#568634'], [0.71, '#5c913b'], [0.88, '#6b9447'], [1, '#79a153']];
    const PEBBLES = ['#4c4d52', '#5d5f65', '#74777d'];

      c.width = c.height = 16;

    }
    function paintDirt(px, pick, rand, at) {
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) px(x, y, 1, 1, pick(DIRT));
      for (let i = 0; i < 12; i++) px(at(16), at(14), 1, 2 + (rand() < 0.4), rand() < 0.5 ? '#452c1a' : '#4f3822');
      for (let i = 0; i < 7; i++) px(at(15), at(16), 2, 1, '#8a6849');
      for (let i = 0; i < 5; i++) px(at(16), at(16), 1, 1, PEBBLES[at(3)]);

    function paintGrassTop(px, pick, rand, at) {
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) px(x, y, 1, 1, pick(GRASS_TOP));
      for (let i = 0; i < 8; i++) px(at(15), at(16), 2, 1, '#5c874f');
      for (let i = 0; i < 8; i++) px(at(16), at(16), 1, 1, '#34522c');
    }
    function paintGrassSide(px, pick, rand, at) {
      paintDirt(px, pick, rand, at);

      for (let x = 0; x < 16; x++) {
        depth = Math.min(5, Math.max(2, depth + at(3) - 1));
        const d = depth + (rand() < 0.12 ? 1 + at(2) : 0);
        for (let y = 0; y < d; y++) px(x, y, 1, 1, pick(GRASS_SIDE));

    }
    const STONE = [[0.25, '#6a6a6a'], [0.55, '#787878'], [0.85, '#858585'], [1, '#939393']];
    const BARK = [[0.3, '#4f3b22'], [0.7, '#62492b'], [1, '#735735']];
    const PLANK = [[0.3, '#9a7a48'], [0.7, '#a78753'], [1, '#b3935d']];
    const LEAF = [[0.25, '#2c5e1f'], [0.6, '#3a7429'], [0.9, '#478a32'], [1, '#56a03b']];
    function paintStone(px, pick, rand, at) {
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) px(x, y, 1, 1, pick(STONE));

    const ore = (light, mid, dark) => (px, pick, rand, at) => {

      for (let b = 0; b < 4; b++) px(b % 2 ? 4 : 11, b * 4, 1, 3, '#7c5f37');

    function paintLeaves(px, pick, rand, at) {
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) px(x, y, 1, 1, pick(LEAF));

    }
    const TNT_LETTERS = ['###.#..#.###', '.#..##.#..#.', '.#..#.##..#.', '.#..#..#..#.', '.#..#..#..#.'];
    function paintTntSide(px) {

      }

    function paintTntTop(px) { px(0, 0, 16, 16, '#b2392b'); px(3, 3, 10, 10, '#cf4a39'); px(7, 7, 2, 2, '#2b2b2b'); }

      pixelTexture, paintDirt, paintGrassTop, paintGrassSide, paintStone,
      paintDiamondOre: ore('#e3fffd', '#4fe3e1', '#178f94'),
      paintGoldOre: ore('#fff8b0', '#f3cf36', '#a87a0c'),

  }

  /* ════════════════════════════════════════════════════════════════════
     Floating items — little blocks and pixel items drifting in the free
     space of the hero. Their spots are measured so they never sit on text.
     ════════════════════════════════════════════════════════════════════ */
  function initFloaters(kit) {
    const canvas = $('#floaters'), hero = $('.hero');
    const T = window.THREE;
    if (!T || !kit) { canvas.remove(); return; }
    let renderer;
    try {
      renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true });
    } catch (err) {
      canvas.remove();
      return;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputEncoding = T.sRGBEncoding;
    const scene = new T.Scene();
    const camera = new T.OrthographicCamera(0, 1, 0, -1, -2000, 2000);   // 1 unit = 1 CSS pixel
    camera.position.z = 500;
    scene.add(new T.AmbientLight(0xffffff, 0.35));
    const key = new T.DirectionalLight(0xffffff, 0.95);
    key.position.set(-3.35, 2.52, 9.07);
    scene.add(key);

    const box = new T.BoxGeometry(1, 1, 1);
    const L = tex => new T.MeshLambertMaterial({ map: tex });
    const tx = (seed, paint) => L(kit.pixelTexture(seed, paint));
    const same = m => [m, m, m, m, m, m];
    const grassSide = tx(11, kit.paintGrassSide), logSide = tx(31, kit.paintLogSide), logTop = tx(33, kit.paintLogTop), tntSide = tx(53, kit.paintTntSide);
    const MATS = {
      grass: [grassSide, grassSide, tx(37, kit.paintGrassTop), tx(41, kit.paintDirt), grassSide, grassSide],
      stone: same(tx(5, kit.paintStone)),
      diamondOre: same(tx(17, kit.paintDiamondOre)),
      goldOre: same(tx(29, kit.paintGoldOre)),
      log: [logSide, logSide, logTop, logTop, logSide, logSide],
      planks: same(tx(43, kit.paintPlanks)),
      leaves: same(tx(47, kit.paintLeaves)),
      tnt: [tntSide, tntSide, tx(55, kit.paintTntTop), tx(57, kit.paintTntBottom), tntSide, tntSide],
    };
    // Pixel items, extruded one pixel deep like dropped items in the game.
    const SPRITES = {
      gem: {
        rows: ['...KKKKKK...', '..KWWCCCCK..', '.KWCCCCCCDK.', 'KCCCCCCCCDDK', 'KCCCCCCCDDDK', '.KCCCCCDDDK.', '..KCCCDDDK..', '...KCDDDK...', '....KDDK....', '.....KK.....'],
        pal: { K: '#0d4a4f', W: '#eaffff', C: '#4fe3e1', D: '#1d9fa5' },
      },
      apple: {
        rows: ['......B.....', '.....B.LL...', '.....BLL....', '..RRRBRRR...', '.RRRRRRRRR..', 'RRWRRRRRRRR.', 'RWRRRRRRRRD.', 'RRRRRRRRRRD.', 'RRRRRRRRRDD.', '.RRRRRRRDD..', '..RRRRRDD...', '...RR.RR....'],
        pal: { B: '#5a3d1e', L: '#4c9a2a', R: '#d0312d', W: '#ff8a80', D: '#8e1b17' },
      },
    };
    const spriteMat = new T.MeshLambertMaterial();
    function spriteMesh(def) {
      const cells = [];
      def.rows.forEach((row, y) => [...row].forEach((ch, x) => { if (def.pal[ch]) cells.push([x, y, def.pal[ch]]); }));
      const w = def.rows[0].length, h = def.rows.length, n = Math.max(w, h);
      const mesh = new T.InstancedMesh(box, spriteMat, cells.length);
      const m = new T.Matrix4(), c = new T.Color(), sc = new T.Vector3(1 / n, 1 / n, 1 / n);
      cells.forEach(([x, y, col], i) => {
        m.makeTranslation((x - w / 2 + 0.5) / n, -(y - h / 2 + 0.5) / n, 0).scale(sc);
        mesh.setMatrixAt(i, m);
        mesh.setColorAt(i, c.set(col).convertSRGBToLinear());
      });
      return mesh;
    }
    const TYPES = ['diamondOre', 'tnt', 'gem', 'log', 'goldOre', 'apple', 'leaves', 'planks', 'grass', 'stone'];
    const easeOutBack = x => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);

    let items = [], W = 0, H = 0, firstLayout = true;
    const t0 = performance.now();
    function layout() {
      const hr = hero.getBoundingClientRect();
      W = Math.round(hr.width); H = Math.round(hr.height);
      if (!W || !H) return;
      renderer.setSize(W, H, false);
      camera.right = W; camera.bottom = -H;
      camera.updateProjectionMatrix();

      // Everything a floating item must stay away from.
      const pad = 14;
      const avoid = [...$$('.hero__word .line-inner', hero), $('#stage'), ...$$('.nav > *', hero), $('.locale', hero), ...$$('.hero__foot > *', hero)]
        .filter(Boolean)
        .map(n => n.getBoundingClientRect())
        .filter(r => r.width && r.height)
        .map(r => ({ l: r.left - hr.left - pad, t: r.top - hr.top - pad, r: r.right - hr.left + pad, b: r.bottom - hr.top + pad }));
      const base = clamp(Math.min(W, H) * 0.075, 28, 72);
      const half = base * 0.8, step = Math.max(10, base * 0.5);
      const spots = [];
      for (let y = half + 8; y <= H - half - 8; y += step) {
        for (let x = half + 4; x <= W - half - 4; x += step) {
          if (!avoid.some(b => x + half > b.l && x - half < b.r && y + half > b.t && y - half < b.b)) spots.push([x, y]);
        }
      }
      // Spread them out: always take the free spot farthest from the ones already used.
      let seed = 7;
      const rnd = () => (seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296;
      const max = W < 700 ? 6 : 10, picks = [];
      if (spots.length) picks.push(spots[Math.floor(rnd() * spots.length)]);
      while (picks.length < max && spots.length) {
        let best = null, bestD = -1;
        for (const sp of spots) {
          let d = Infinity;
          for (const pk of picks) d = Math.min(d, Math.hypot(sp[0] - pk[0], sp[1] - pk[1]));
          if (d > bestD) { bestD = d; best = sp; }
        }
        if (bestD < base * 1.9) break;
        picks.push(best);
      }

      items.forEach(it => scene.remove(it.obj));
      items = picks.map(([x, y], i) => {
        const type = TYPES[i % TYPES.length];
        const sprite = !!SPRITES[type];
        const obj = sprite ? spriteMesh(SPRITES[type]) : new T.Mesh(box, MATS[type]);
        scene.add(obj);
        const size = base * (sprite ? 1.05 : 0.75 + rnd() * 0.3);
        return {
          obj, x, y, size,
          tilt: sprite ? 0.1 : 0.45 + rnd() * 0.2,
          roll: (rnd() - 0.5) * 0.3,
          spin: (0.4 + rnd() * 0.5) * (rnd() < 0.5 ? -1 : 1),
          bob: size * 0.12,
          bobSpeed: 0.9 + rnd() * 0.6,
          phase: rnd() * Math.PI * 2,
          appearAt: firstLayout && !reduce ? 0.7 + i * 0.09 : null,
        };
      });
      firstLayout = false;
      draw(performance.now());
    }
    function draw(now) {
      const t = (now - t0) / 1000;
      items.forEach(it => {
        const k = it.appearAt == null ? 1 : easeOutBack(clamp((t - it.appearAt) / 0.7, 0, 1));
        it.obj.scale.setScalar(Math.max(0.0001, k * it.size));
        it.obj.position.set(it.x, -(it.y + (reduce ? 0 : Math.sin(t * it.bobSpeed + it.phase) * it.bob)), 0);
        it.obj.rotation.set(it.tilt, it.phase + (reduce ? 0 : t * it.spin), it.roll);
      });
      renderer.render(scene, camera);
    }

    let visible = true, running = false, queued = false;
    function frame(now) {
      if (!visible || reduce) { running = false; return; }
      draw(now);
      requestAnimationFrame(frame);
    }
    function start() {
      if (running || !visible || reduce) return;
      running = true;
      requestAnimationFrame(frame);
    }
    const relayout = () => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; layout(); }); } };
    if ('ResizeObserver' in window) {
      const ro = new ResizeObserver(relayout);
      [hero, $('.hero__stack'), $('.hero__foot')].forEach(n => n && ro.observe(n));
    } else {
      window.addEventListener('resize', relayout);
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(([entry]) => { visible = entry.isIntersecting; start(); }).observe(hero);
    }
    layout();
    start();
  }

  /* ════════════════════════════════════════════════════════════════════
     3D stage — a pixel-art grass block floating in the hero.
     Drag it (finger or mouse) to spin it; the page never scrolls while
     you do. It keeps its momentum, turns grass-side up again and idles.
     ════════════════════════════════════════════════════════════════════ */
  function initStage(kit) {
    const canvas = $('#stage');
    const T = window.THREE;
    if (!T || !kit) { canvas.remove(); return; }
    let renderer;
    try {
      renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true });
    } catch (err) {
      canvas.remove();
      return;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputEncoding = T.sRGBEncoding;

    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(12, 1, 0.1, 100);   // long lens ≈ isometric look
    camera.position.set(0, 0, 18.5);

    // Game-style face shading at rest: top and left face at full brightness, right face ≈ 75%.
    scene.add(new T.AmbientLight(0xffffff, 0.3));
    const key = new T.DirectionalLight(0xffffff, 1.015);
    key.position.set(-3.35, 2.52, 9.07);
    scene.add(key);

    const { pixelTexture, paintDirt, paintGrassTop, paintGrassSide } = kit;
    const mat = tex => new T.MeshLambertMaterial({ map: tex });
    // BoxGeometry face order: +x, -x, +y (top), -y (bottom), +z, -z
    const faces = [
      mat(pixelTexture(11, paintGrassSide)),
      mat(pixelTexture(23, paintGrassSide)),
      mat(pixelTexture(37, paintGrassTop)),
      mat(pixelTexture(41, paintDirt)),
      mat(pixelTexture(59, paintGrassSide)),
      mat(pixelTexture(73, paintGrassSide)),
    ];
    const cube = new T.Mesh(new T.BoxGeometry(2, 2, 2), faces);
    cube.quaternion.setFromEuler(new T.Euler(0, Math.PI / 4, 0));
    const tilt = new T.Group();
    tilt.add(cube);
    scene.add(tilt);

    const X = new T.Vector3(1, 0, 0), Y = new T.Vector3(0, 1, 0);
    const qa = new T.Quaternion(), qb = new T.Quaternion(), tmp = new T.Vector3();
    const BASE_TILT = 0.52, AUTO_SPIN = 0.45;
    let vx = reduce ? 0 : 5, vy = 0;
    let autoW = reduce ? 0 : 1, s = reduce ? 1 : 0;
    let dragging = false, lastX = 0, lastY = 0, lastT = 0;
    const ptr = { x: 0, y: 0, tx: 0, ty: 0 };

    function turn(ay, ax) {
      qa.setFromAxisAngle(Y, ay); cube.quaternion.premultiply(qa);
      qa.setFromAxisAngle(X, ax); cube.quaternion.premultiply(qa);
    }
    function settle(k) {
      tmp.copy(Y).applyQuaternion(cube.quaternion);
      qa.setFromUnitVectors(tmp.normalize(), Y);
      qb.copy(qa).multiply(cube.quaternion);
      cube.quaternion.slerp(qb, k);
    }

    // Keep the page still while a finger is on the block (iOS ignores touch-action on its own).
    const holdPage = e => { if (e.cancelable) e.preventDefault(); };
    canvas.addEventListener('touchstart', holdPage, { passive: false });
    canvas.addEventListener('touchmove', holdPage, { passive: false });

    canvas.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      dragging = true;
      autoW = 0; vx = vy = 0;
      lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      canvas.classList.add('is-grabbing');
      e.preventDefault();
    });
    canvas.addEventListener('pointermove', e => {
      if (!dragging) return;
      e.preventDefault();
      const now = performance.now(), dt = Math.max(0.008, (now - lastT) / 1000);
      const k = (Math.PI * 1.6) / canvas.clientWidth;
      const ay = (e.clientX - lastX) * k, ax = (e.clientY - lastY) * k;
      turn(ay, ax);
      vx = clamp(vx * 0.5 + (ay / dt) * 0.5, -14, 14);
      vy = clamp(vy * 0.5 + (ax / dt) * 0.5, -14, 14);
      lastX = e.clientX; lastY = e.clientY; lastT = now;
    });
    const release = e => {
      if (!dragging) return;
      dragging = false;
      if (performance.now() - lastT > 90) vx = vy = 0;
      canvas.classList.remove('is-grabbing');
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    };
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);
    canvas.addEventListener('lostpointercapture', release);
    canvas.addEventListener('keydown', e => {
      const push = { ArrowLeft: [-4, 0], ArrowRight: [4, 0], ArrowUp: [0, -4], ArrowDown: [0, 4] }[e.key];
      if (!push) return;
      e.preventDefault();
      vx += push[0]; vy += push[1]; autoW = 0;
    });
    window.addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse' || dragging) return;
      ptr.tx = clamp(e.clientX / window.innerWidth * 2 - 1, -1, 1);
      ptr.ty = clamp(e.clientY / window.innerHeight * 2 - 1, -1, 1);
    }, { passive: true });

    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    if ('ResizeObserver' in window) new ResizeObserver(resize).observe(canvas);
    else window.addEventListener('resize', resize);
    resize();

    let visible = true, running = false, prev = 0;
    function frame(now) {
      if (!visible) { running = false; return; }
      const dt = Math.min(0.05, Math.max(0, (now - prev) / 1000));
      prev = now;
      if (!dragging) {
        const damp = Math.exp(-2.4 * dt);
        vx *= damp; vy *= damp;
        if (!reduce) autoW = Math.min(1, autoW + dt * 0.5);
        turn((vx + AUTO_SPIN * autoW) * dt, vy * dt);
        if (Math.abs(vy) < 0.6) settle(1 - Math.exp(-3 * dt));
      }
      s += (1 - s) * (1 - Math.exp(-4 * dt));
      ptr.x += (ptr.tx - ptr.x) * (1 - Math.exp(-4 * dt));
      ptr.y += (ptr.ty - ptr.y) * (1 - Math.exp(-4 * dt));
      tilt.rotation.set(BASE_TILT + ptr.y * 0.12, ptr.x * 0.25, 0);
      tilt.position.y = reduce ? 0 : Math.sin(now / 1000 * 1.1) * 0.08;
      tilt.scale.setScalar(Math.max(0.0001, s));
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    function start() {
      if (running || !visible) return;
      running = true;
      prev = performance.now();
      requestAnimationFrame(frame);
    }
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(([entry]) => { visible = entry.isIntersecting; start(); }).observe(canvas);
    }
    start();
  }

  /* ── Boot ── */
  splitLetters();
  applyLang(lang, false);
  const kit = window.THREE ? pixelKit(window.THREE) : null;
  initStage(kit);
  initFloaters(kit);
  syncProgress();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitContactWord);
  if (store.get('sessionStorage', 'netvy-admin') === '1') unlock();
  if (location.hash === '#admin') openAdmin();
})();
</script>
</body></html>
